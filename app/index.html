<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Tesseract Hands</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: #9fe8ff;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed;
        top: 12px;
        left: 14px;
        padding: 8px 10px;
        background: rgba(0, 10, 20, 0.55);
        border: 1px solid rgba(120, 220, 255, 0.25);
        border-radius: 6px;
        white-space: pre;
        pointer-events: none;
      }
      #status {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 6px;
        background: rgba(0, 10, 20, 0.7);
        border: 1px solid rgba(120, 220, 255, 0.25);
        transition: opacity 0.6s;
      }
      #status.error { color: #ff8a9a; border-color: rgba(255, 120, 140, 0.5); }
      #status.hidden { opacity: 0; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="status">Starting…</div>
    <script src="renderer.js"></script>
  </body>
</html>
